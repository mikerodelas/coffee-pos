<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Coffee POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root{
  --bg:#FAF6F1; --surface:#FFFFFF; --ink:#2A1B12; --muted:#7B6B5E; --line:#EEE5DB; --line-2:#E2D6C9;
  --brand:#5B3A29; --brand-2:#7A4E36; --brand-soft:#F3EAE1; --accent:#C8873A; --accent-soft:#FBEFD9;
  --ok:#2E7D5B; --ok-soft:#E4F4EB; --warn:#B86E0B; --warn-soft:#FFF1D6; --bad:#BF3B2E; --bad-soft:#FCE8E5; --info:#2F6DB5; --info-soft:#E6F0FB;
  --r:18px; --r-sm:12px; --shadow:0 1px 2px rgba(60,35,20,.05),0 8px 24px rgba(60,35,20,.06); --shadow-lg:0 20px 60px rgba(40,22,10,.25);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3{font-weight:700;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.right{text-align:right} .center{text-align:center} .hidden{display:none!important}
.row{display:flex;align-items:center;gap:10px} .row.wrap{flex-wrap:wrap} .between{justify-content:space-between} .grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:10px}
.gap-sm{gap:6px} .gap-lg{gap:18px} .mt{margin-top:14px} .mb{margin-bottom:14px} .mt-lg{margin-top:24px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--r-sm);font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--line-2);transition:transform .08s,background .15s,box-shadow .15s;min-height:42px;white-space:nowrap}
.btn:hover{background:#FBF7F2} .btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(91,58,41,.25)} .btn.primary:hover{background:var(--brand-2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff} .btn.accent:hover{background:#B87830}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:#EFC5BF;background:#fff} .btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)} .btn.ghost:hover{background:var(--brand-soft)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px} .btn.lg{min-height:56px;font-size:17px;padding:14px 22px;border-radius:16px}
.btn.block{width:100%} .btn[disabled]{opacity:.45;pointer-events:none}
.btn.icon{width:42px;padding:0} .btn.sm.icon{width:34px}
kbd{font-family:inherit;font-size:11px;background:rgba(0,0,0,.08);border-radius:6px;padding:1px 6px;margin-left:4px;font-weight:600}
.btn.primary kbd{background:rgba(255,255,255,.2)}

/* ---------- inputs ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;padding:11px 13px;border:1.5px solid var(--line-2);border-radius:var(--r-sm);background:#fff;transition:border-color .15s,box-shadow .15s;min-height:44px}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(200,135,58,.15)}
textarea.input{min-height:76px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px} .form-grid .full{grid-column:1/-1}
.check{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;min-height:36px} .check input{width:20px;height:20px;accent-color:var(--brand)}
.search{position:relative} .search input{padding-left:40px} .search::before{content:'🔍';position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.7}
.seg{display:inline-flex;background:var(--brand-soft);padding:4px;border-radius:14px;gap:2px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:11px;font-weight:600;font-size:13.5px;color:var(--brand-2);min-height:38px}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(60,35,20,.15)}
.seg.full{display:flex} .seg.full button{flex:1}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;border:1px solid rgba(238,229,219,.7)}
.card h3{font-size:15px;margin-bottom:12px} .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.card-head h3{margin:0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--brand-soft);color:var(--brand-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.dark{background:var(--brand);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.divider{height:1px;background:var(--line);margin:14px 0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:10px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs button.on{color:var(--brand);border-color:var(--accent)}
.badge{background:var(--bad);color:#fff;border-radius:99px;min-width:20px;height:20px;padding:0 6px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:240px 1fr;height:100vh;height:100dvh}
.side{background:var(--brand);color:#F6E9DC;display:flex;flex-direction:column;padding:20px 14px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 18px;color:#fff}
.brand .logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#E8B26A,#C8873A);display:grid;place-items:center;font-size:22px;box-shadow:0 6px 14px rgba(0,0,0,.25);overflow:hidden}
.brand .logo img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;font-size:15px;line-height:1.2} .brand span{font-size:12px;opacity:.7}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;color:#E9D8C8;font-weight:600;font-size:14.5px;width:100%;text-align:left;transition:background .15s}
.nav-item:hover{background:rgba(255,255,255,.08)} .nav-item.on{background:#fff;color:var(--brand);box-shadow:0 8px 20px rgba(0,0,0,.18)}
.nav-item .ic{font-size:18px;width:24px;text-align:center} .nav-item .badge{margin-left:auto}
.side .spacer{flex:1}
.user-card{background:rgba(255,255,255,.08);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.main{display:flex;flex-direction:column;min-width:0;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 26px;min-height:68px}
.topbar h1{font-size:22px} .topbar .sub{font-size:13px;color:var(--muted)}
.content{flex:1;overflow-y:auto;padding:0 26px 40px}
.content.flush{padding:0 14px 14px;overflow:hidden}
.bottomnav{display:none}
.shift-pill{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:99px;background:#fff;border:1px solid var(--line-2);font-weight:600;font-size:13px}
.shift-pill.open{color:var(--ok);border-color:#BFE3CF;background:var(--ok-soft)} .shift-pill.closed{color:var(--warn);background:var(--warn-soft);border-color:#F4D9A0}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 600px at 10% -10%,#F3DEC4 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#E7CDB1 0,transparent 55%),var(--bg)}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:28px;box-shadow:var(--shadow-lg);padding:30px 28px}
.login-card .logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#E8B26A,#C8873A);display:grid;place-items:center;font-size:32px;margin:0 auto 14px;box-shadow:0 10px 24px rgba(200,135,58,.4)}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:14px 0 18px;min-height:18px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);transition:all .12s} .pin-dots i.on{background:var(--brand);border-color:var(--brand);transform:scale(1.1)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{height:62px;border-radius:18px;background:var(--brand-soft);font-size:22px;font-weight:600;color:var(--brand);transition:transform .06s,background .12s}
.keypad button:active{transform:scale(.94);background:#E9D9C8} .keypad .go{background:var(--brand);color:#fff}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- grid helpers ---------- */
.grid{display:grid;gap:16px} .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.g-main{grid-template-columns:2fr 1fr}
.kpi{padding:18px;border-radius:var(--r);background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;border:1px solid rgba(238,229,219,.7);position:relative;overflow:hidden}
.kpi .k-label{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .k-value{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.kpi .k-sub{font-size:12.5px;color:var(--muted)}
.kpi .k-ic{position:absolute;right:14px;top:14px;font-size:22px;opacity:.9;width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--accent-soft)}
.kpi.dark{background:linear-gradient(135deg,#5B3A29,#7A4E36);color:#fff} .kpi.dark .k-label,.kpi.dark .k-sub{color:#EBD9C7} .kpi.dark .k-ic{background:rgba(255,255,255,.15)}
.up{color:var(--ok);font-weight:700} .down{color:var(--bad);font-weight:700}

/* ---------- lists / tables ---------- */
.list>.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)} .list>.li:last-child{border-bottom:none}
.li.click{cursor:pointer;border-radius:12px;padding-left:10px;padding-right:10px} .li.click:hover{background:#FBF7F2}
.rank{width:28px;height:28px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-weight:800;display:grid;place-items:center;font-size:13px;flex:none}
.thumb{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;overflow:hidden;background-size:cover;background-position:center}
.thumb.lg{width:64px;height:64px;font-size:32px;border-radius:18px}
.tbl-wrap{overflow-x:auto;border-radius:var(--r-sm)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:#FCFAF7;position:sticky;top:0}
.tbl td{padding:12px;border-bottom:1px solid var(--line)} .tbl tr:hover td{background:#FDFAF6} .tbl td.r,.tbl th.r{text-align:right}
.bar{height:10px;border-radius:99px;background:var(--brand-soft);overflow:hidden} .bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#E0A35A)}
.bar.low>i{background:linear-gradient(90deg,#E0A020,#F0B84A)} .bar.out>i{background:var(--bad)} .bar.ok>i{background:linear-gradient(90deg,#3E9C74,#5DBB93)}

/* ---------- empty / loading ---------- */
.empty{text-align:center;padding:44px 20px;color:var(--muted)} .empty .e-ic{font-size:46px;margin-bottom:8px} .empty h3{color:var(--ink);margin-bottom:6px} .empty p{max-width:340px;margin:0 auto 16px}
.skel{background:linear-gradient(90deg,#F1E8DE 25%,#F8F2EA 50%,#F1E8DE 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px;min-height:20px}
@keyframes sk{to{background-position:-200% 0}}
.spinner{width:22px;height:22px;border:3px solid var(--line-2);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;display:inline-block} @keyframes spin{to{transform:rotate(360deg)}}
.loading{display:grid;place-items:center;padding:60px}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r-sm);background:var(--warn-soft);color:#7A4A06;font-weight:600;margin-bottom:14px;flex-wrap:wrap}
.banner.info{background:var(--info-soft);color:#1F4F88} .banner.bad{background:var(--bad-soft);color:#8E2A20} .banner.ok{background:var(--ok-soft);color:#1F5E43}

/* ---------- toast / modal / drawer ---------- */
.toasts{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:200;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;box-shadow:var(--shadow-lg);font-weight:600;font-size:14px;animation:tin .25s;max-width:340px;pointer-events:auto}
.toast.ok{background:#1F5E43} .toast.warn{background:#8A560A} .toast.bad{background:#8E2A20}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.backdrop{position:fixed;inset:0;background:rgba(36,20,10,.45);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:24px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;animation:pop .2s}
.modal.wide{max-width:760px} .modal.sm{max-width:400px}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}}
.modal-head{padding:20px 22px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px} .modal-head h2{font-size:19px}
.modal-body{padding:8px 22px 18px;overflow-y:auto} .modal-foot{padding:14px 22px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line)}
.modal-foot .btn.block{flex:1}
.drawer-wrap{position:fixed;inset:0;z-index:100;display:flex;justify-content:flex-end;background:rgba(36,20,10,.4);animation:fade .15s}
.drawer{background:var(--bg);width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;animation:slide .22s;box-shadow:var(--shadow-lg)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.drawer-head{padding:18px 22px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer-body{flex:1;overflow-y:auto;padding:20px 22px} .drawer-foot{padding:14px 22px;background:#fff;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:132px 1fr 384px;gap:14px;height:100%;min-height:0}
.pos-cats{display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding:2px}
.cat-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:18px;background:#fff;border:1.5px solid transparent;font-weight:700;font-size:13px;color:var(--brand-2);box-shadow:var(--shadow);transition:all .12s}
.cat-btn .ci{font-size:26px} .cat-btn.on{background:var(--brand);color:#fff;border-color:var(--brand)} .cat-btn:active{transform:scale(.97)}
.pos-mid{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.pos-grid{display:grid;grid-auto-rows:max-content;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;overflow-y:auto;padding:2px 2px 20px;align-content:start;flex:1}
.prod{flex-shrink:0;background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .1s,box-shadow .15s;border:1.5px solid transparent;position:relative}
.prod:hover{box-shadow:0 10px 30px rgba(60,35,20,.12)} .prod:active{transform:scale(.97)}
.prod-art{height:98px;display:grid;place-items:center;font-size:46px;background-size:cover;background-position:center}
.prod-info{padding:10px 12px 12px} .prod-name{font-weight:700;font-size:14.5px;line-height:1.25;min-height:36px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod-price{font-weight:800;font-size:16px;color:var(--brand);margin-top:2px}
.prod.out{opacity:.55;pointer-events:none;filter:grayscale(.6)} .prod .tag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:800;background:var(--bad);color:#fff;border-radius:99px;padding:3px 9px}
.prod .star{position:absolute;top:8px;right:8px;font-size:15px;background:rgba(255,255,255,.85);border-radius:99px;width:26px;height:26px;display:grid;place-items:center}
.prod .qty-badge{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;font-weight:800;font-size:13px;box-shadow:0 4px 10px rgba(200,135,58,.5)}
.order-panel{background:#fff;border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.op-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.op-lines{flex:1;overflow-y:auto;padding:6px 12px}
.op-line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 6px;border-bottom:1px dashed var(--line)}
.op-line .ln-name{font-weight:700} .op-line .ln-opts{font-size:12.5px;color:var(--muted);grid-column:1} .op-line .ln-price{font-weight:700;text-align:right}
.qty{display:inline-flex;align-items:center;background:var(--brand-soft);border-radius:12px} .qty button{width:34px;height:34px;font-size:18px;font-weight:700;color:var(--brand)} .qty span{min-width:26px;text-align:center;font-weight:700}
.op-foot{padding:12px 16px 16px;border-top:1px solid var(--line);background:#FDFBF8}
.tot-row{display:flex;justify-content:space-between;padding:2px 0;color:var(--muted);font-size:14px} .tot-row.big{color:var(--ink);font-size:26px;font-weight:800;padding-top:8px;letter-spacing:-.02em}
.opt-group{margin-bottom:16px} .opt-group h4{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.opt-row{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:11px 16px;border-radius:14px;border:2px solid var(--line-2);font-weight:700;background:#fff;min-height:48px;transition:all .1s;text-align:center}
.opt small{display:block;font-weight:600;color:var(--muted);font-size:12px} .opt.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)} .opt:active{transform:scale(.96)}
.opt.addon.on{border-color:var(--accent);background:var(--accent-soft)}
.method-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.method{padding:14px 8px;border-radius:16px;border:2px solid var(--line-2);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff} .method .mi{font-size:24px} .method.on{border-color:var(--brand);background:var(--brand-soft)}
.quick-cash{display:flex;gap:8px;flex-wrap:wrap}
.cash-box{background:var(--brand-soft);border-radius:18px;padding:14px 16px}
.change-box{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:18px;background:var(--ok-soft);color:var(--ok);font-weight:800;font-size:22px}
.change-box.short{background:var(--bad-soft);color:var(--bad)}
.mobile-order-bar{display:none}
.success-ring{width:84px;height:84px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:42px;margin:6px auto 12px;animation:pop .3s}

/* ---------- orders / kitchen ---------- */

@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(217,83,74,.2)}}

.kds-card .btn{margin-top:10px;min-height:52px;font-size:16px;width:100%}

/* ---------- charts ---------- */
.chart{width:100%;height:190px} .chart text{font-size:11px;fill:var(--muted);font-family:var(--font)}
.chart .bar-r{fill:#E7CDB1;transition:fill .15s} .chart .bar-r.today{fill:var(--accent)} .chart .bar-r:hover{fill:var(--brand-2)}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.hbar{display:grid;grid-template-columns:110px 1fr 90px;align-items:center;gap:10px;margin:8px 0;font-size:13.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}

pre.code{background:#2A1B12;color:#F6E9DC;padding:14px;border-radius:14px;overflow:auto;font-size:12px;line-height:1.5;max-height:320px;white-space:pre}
.copy-row{display:flex;gap:8px;align-items:center;background:var(--brand-soft);border-radius:12px;padding:8px 10px} .copy-row code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .g3,.g2{grid-template-columns:1fr} .g4{grid-template-columns:repeat(2,1fr)} .kds-cols{grid-template-columns:1fr}

  .hbar{grid-template-columns:90px 1fr 74px}
}

  points.forEach(function (p, i) {

    if (n <= 14) svg += '<text x="' + (x + bw / 2) + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(p.label) + '</text>';

      var rv = e.target.closest('[data-revoke]'); if (rv && await confirmBox({ title: 'Revoke this key?', msg: 'The order page using it will stop working until you give it a new key.', ok: 'Revoke', danger: true })) { await api('intake.keyRevoke', { id: rv.dataset.revoke }); toast('Key revoked'); renderRoute(); }
      if (id === 'in-savepull') { var f = readForm($('#in-pull', el)); await api('settings.save', { values: { intake_pull_url: f.intake_pull_url, intake_pull_token: f.intake_pull_token } }); toast('Saved'); renderRoute(); }
      if (id === 'in-pullnow') { var pr = await busy(e.target, function () { return api('intake.pullNow'); }); toast(pr.created + ' new order' + (pr.created === 1 ? '' : 's') + ' found' + (pr.failed ? ', ' + pr.failed + ' could not be read' : '')); renderRoute(); }
      if (id === 'in-test') { var t = await busy(e.target, function () { return api('intake.test'); }); toast('Test order ' + t.number + ' created — see Orders → Online'); S.onlinePending++; renderRoute(); }
    } catch (er) { fail(er); }
  };
  $('#in-on', el).onchange = async function () { try { await api('settings.save', { values: { intake_enabled: this.checked ? 'TRUE' : 'FALSE' } }); toast(this.checked ? 'Now receiving online orders' : 'Online orders paused'); } catch (er) { fail(er); } };
}
</script>

  <script>
/* ===========================================================================
   Boot: sign-in screen, start-up and background refresh
   =========================================================================== */
var loginPin = '';

function showLogin(msg) {
  loginPin = ''; S.timers.forEach(clearInterval); S.timers = [];
  var last = store.get('cpos_user') || '';
  $('#root').innerHTML = '<div class="login"><form class="login-card" id="lg-form" autocomplete="off" novalidate>' +
    '<div class="logo">☕</div><h1 style="text-align:center;font-size:22px">Coffee POS</h1><p class="muted" style="text-align:center;margin:4px 0 18px">Sign in to start your shift</p>' +
    (msg ? '<div class="banner warn" id="lg-msg" role="alert">' + esc(msg) + '</div>' : '<div id="lg-msg" role="alert"></div>') +
    '<div class="field"><label for="lg-user">Username</label><input class="input" id="lg-user" autocapitalize="none" autocomplete="username" spellcheck="false" value="' + esc(last) + '" placeholder="e.g. juan"></div>' +
    '<div class="lbl" style="text-align:center;margin-top:6px">PIN</div><div class="pin-dots" id="lg-dots" aria-live="polite"></div>' +
    '<div class="keypad">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) { return '<button type="button" data-k="' + n + '">' + n + '</button>'; }).join('') + '<button type="button" data-k="back" aria-label="Delete">⌫</button><button type="button" data-k="0">0</button><button type="submit" class="go" aria-label="Sign in">→</button></div>' +
    '<p class="tiny muted" style="text-align:center;margin-top:16px">Forgot your PIN? Ask your manager or owner to reset it.</p></form></div>';
  var dots = function () { var h = '', n = Math.max(4, loginPin.length); for (var i = 0; i < n; i++) h += '<i class="' + (i < loginPin.length ? 'on' : '') + '"></i>'; $('#lg-dots').innerHTML = h; };
  dots();
  var setMsg = function (t) { var m = $('#lg-msg'); if (m) { m.className = t ? 'banner bad' : ''; m.textContent = t || ''; } };
  var submit = async function () {
    var u = $('#lg-user').value.trim().toLowerCase();
    if (!u) { setMsg('Please enter your username.'); $('#lg-user').focus(); return; }
    if (loginPin.length < 4) { setMsg('Please enter your PIN (at least 4 digits).'); return; }
    var btn = $('.keypad .go'); btn.disabled = true;
    try {
      var r = await api('auth.login', { username: u, pin: loginPin });
      S.token = r.token; store.set('cpos_token', r.token); store.set('cpos_user', u);
      document.removeEventListener('keydown', loginKeys);
      await startApp(true);
    } catch (e) { loginPin = ''; dots(); setMsg(e.message); btn.disabled = false; }
  };
  var loginKeys = function (e) {
    if (!$('#lg-form')) { document.removeEventListener('keydown', loginKeys); return; }
    if (document.activeElement && document.activeElement.id === 'lg-user') { if (e.key === 'Enter') { e.preventDefault(); $('#lg-form').dispatchEvent(new Event('submit', { cancelable: true })); } return; }
    if (/^\d$/.test(e.key) && loginPin.length < 12) { loginPin += e.key; dots(); }
    else if (e.key === 'Backspace') { loginPin = loginPin.slice(0, -1); dots(); }
    else if (e.key === 'Enter') { e.preventDefault(); submit(); }
  };
  document.addEventListener('keydown', loginKeys);
  $('#lg-form').addEventListener('submit', function (e) { e.preventDefault(); submit(); });
  $('.keypad').addEventListener('click', function (e) {
    var b = e.target.closest('[data-k]'); if (!b) return; setMsg('');
    if (b.dataset.k === 'back') loginPin = loginPin.slice(0, -1); else if (loginPin.length < 12) loginPin += b.dataset.k;
    dots();
  });
  setTimeout(function () { var u = $('#lg-user'); if (u && !u.value) u.focus(); }, 60);
}

async function startApp(fresh) {
  $('#root').innerHTML = '<div class="login"><div class="loading"><span class="spinner"></span></div></div>';
  try {
    var b = await api('app.bootstrap');
    S.boot = b; S.user = b.user; S.shift = b.shift; S.onlinePending = b.online_pending || 0; S.lowStock = b.low_stock || 0; S.cart = null;
    S.route = S.user.role === 'Cashier' || !can('dashboard.view') ? (can('pos.use') ? 'pos' : 'orders') : 'dashboard';
    S.sub = {};
    renderRoute();
    startPolling();
    if (fresh && b.weak_pin) setTimeout(function () { toast('Please change your PIN — it is still the starting one.', 'warn'); changePinDialog(); }, 600);
  } catch (e) {
    if (e.code === 'AUTH') { showLogin(); return; }
    $('#root').innerHTML = '<div class="login"><div class="login-card" style="text-align:center">' + emptyState('📡', 'We couldn’t open Coffee POS', e.message, '<button class="btn primary" id="bt-retry">Try again</button>') + '</div></div>';
    $('#bt-retry').onclick = function () { startApp(false); };
  }
}

var _pollBusy = false;
function startPolling() {
  if (S.pollTimer) clearInterval(S.pollTimer);
  S.pollTimer = setInterval(async function () {
    if (!S.user || document.hidden || _pollBusy) return;
    _pollBusy = true;
    try {
      var b = await api('app.bootstrap'), prev = S.onlinePending;
      if (!S.user) return;
      S.onlinePending = b.online_pending || 0; S.lowStock = b.low_stock || 0; S.shift = b.shift; S.boot.menu = b.menu;
      if (S.onlinePending > prev) { toast('🛎 New online order received', 'ok'); if (typeof beep === 'function') beep(); }
      refreshBadges();
      $$('[data-badge="inventory"]').forEach(function (x) { x.textContent = S.lowStock; x.style.display = S.lowStock ? '' : 'none'; });
    } catch (e) { /* offline blips are fine; the next tick tries again */ }
    finally { _pollBusy = false; }
  }, 30000);
}

/* page restored from a tab refresh */
(function boot() {
  S.token = store.get('cpos_token');
  if (!S.token) { showLogin(); return; }
  startApp(false);
})();
</script>
